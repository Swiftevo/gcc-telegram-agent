  - case_id: gcc-travel-scholarship-devconnect-2025
    schema_version: "0.1.0"
    canonical_project_id: project-devconnect-2025
    title: Devconnect 機票 2025
    category: Travel Scholarship
    fund_type: special
    public_record:
      amount_usd:
      regions: [Chinese-speaking community, global]
      tags: [travel scholarship, builder support, Ethereum, conference access]
      summary: >
        Devconnect 機票 2025 is a travel scholarship plan supporting
        Chinese-speaking builders to attend Devconnect 2025 in Buenos Aires,
        Argentina, from November 17 to 22, 2025. The plan provides a total of
        5,000 USD, with a per-person reimbursement cap of 1,000 USD.
      why_funded: >
        This travel scholarship case supports builders who contribute to open
        source and public goods but face high travel costs, long routes, visa
        complexity, and cross-language/cross-cultural barriers. The public goods
        value comes from enabling face-to-face collaboration, global visibility,
        and post-event community knowledge sharing.
      links:
        gcc_project_url: https://www.gccofficial.org/project/project-devconnect-2025
        official_website: https://x.com/GCCofCommons/status/1978780446596239625
        repository_url:
    evidence:
