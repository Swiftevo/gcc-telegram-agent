purpose: >
  Seed records for a reusable Chinese-language public goods database. This file
  includes one representative case from each current GCC category and reserves
  extension points for project snapshots, detailed grant applications, and
  committee voting records.

cases:
  - case_id: gcc-open-source-vyper
    schema_version: "0.1.0"
    canonical_project_id: project-vyper
    title: Vyper
    category: Open Source
    fund_type: public
    public_record:
      amount_usd: 40000
      regions: [global, Chinese-speaking community]
      tags: [Vyper, Ethereum, EVM, smart contract security, developer education, Chinese localization]
      summary: >
        Vyper is a Python-like smart contract language for Ethereum and EVM
        chains. The GCC-funded proposal focused on building a Chinese-speaking
        Vyper developer ecosystem through online cohort learning, offline
        events, and reusable community content.
      why_funded: >
        The case represents an open-source infrastructure and developer
        education public good: it localizes a security-first smart contract
        language for Chinese-speaking builders and aims to reduce ecosystem-wide
        contract risk through better default tooling and education.
      links:
        gcc_project_url: https://www.gccofficial.org/project/project-vyper
        official_website: https://vyperlang.org/
        repository_url:
    evidence:
      source_urls:
        - https://snapshot.org/#/s:gccofficial.eth/proposal/0xa699f6d04f81eb321b87d3491fcc3ebb97fc26ab8047e12587fe88bbc17e86a5
        - https://www.gccofficial.org/project/project-vyper
        - https://vyperlang.org/
      snapshots:
        - snapshot_id: snap-vyper-snapshot-proposal
          captured_at: "2026-05-27"
          source_type: snapshot_proposal
          access_level: public
          source_url: https://snapshot.org/#/s:gccofficial.eth/proposal/0xa699f6d04f81eb321b87d3491fcc3ebb97fc26ab8047e12587fe88bbc17e86a5
          storage_uri: data/source-snapshots/vyper-snapshot-proposal.md
          checksum:
          notes: Snapshot proposal title, grant amount, vote summary, and extracted rationale.
      grant_application:
        status: available
        access_level: public
        document_ref: snapshot:0xa699f6d04f81eb321b87d3491fcc3ebb97fc26ab8047e12587fe88bbc17e86a5
        snapshot_id: snap-vyper-snapshot-proposal
        summary: >
          Public Snapshot proposal describes the Vyper Chinese developer
          ecosystem plan, requested 40,000u, public problems, ecosystem gap, and
          execution approach.
        notes: Detailed private application can be linked later if GCC has a fuller submission record.
      voting_record:
        status: available
        access_level: public
        document_ref: snapshot:0xa699f6d04f81eb321b87d3491fcc3ebb97fc26ab8047e12587fe88bbc17e86a5
        snapshot_id: snap-vyper-snapshot-proposal
        summary: >
          Snapshot state closed. Choices: 赞成, 反对, 弃权, 维持原金额, 增加5%,
          增加10%, 减少5%, 减少10%. Scores: 6, 0, 3, 3, 0, 0, 1, 2.
        notes: Public Snapshot scores are recorded as vote-summary evidence, not as final legal accounting.
    ai_review_usage:
      allowed: true
      retrieval_text: >
        Open-source precedent for security-first developer infrastructure,
        Chinese localization, Ethereum tooling education, and reusable learning
        content. Useful when reviewing proposals that bridge global open-source
        infrastructure into Chinese-speaking developer communities.
      screening_dimensions:
        - mission_fit
        - public_goods_nature
        - chinese_community
        - precedent_similarity
      cautions:
        - Do not treat Snapshot score summary as the complete committee deliberation.
    governance:
      visibility: public
      license:
      maintainers: [GCC]
      review_status: seed

