approved_projections:
  - projection_id: gcc-history-2022-2025
    topic: GCC historical development
    language: zh-Hant
    scope: historical_only
    question_examples:
      - GCC 在 2023 至 2025 年做過甚麼？
      - GCC 的發展歷史是怎樣？
    answer_text: 根據 GCC《2023–2025 公共物品之路》，GCC 的發展由 2022 年 10 月 Gitcoin Grants 15／16 的華語 matching round 起步；2023 年建立初期治理與營運、展開定向資助及 Builder 機票支持；2024 年推進社群治理與 Gitcoin Asia Round；2025 年建立 ETH City、高校 Web3 興趣小組專項基金及 Cohort 申請制度。這是報告期內的歷史概覽，不代表所有計劃或政策目前仍然相同。
    source_references:
      - source_id: gcc-report-2023-2025-cn
        section_ids: [organization-context]
    citation:
      label: GCC 2023–2025 公共物品之路
      url: https://drive.google.com/file/d/15HztLjCcUtatmknZuUZbjb1ifEojzKfR/view
    excluded_claims:
      - present policy or programme availability
      - individual payment or milestone execution
    review: {status: approved, reviewed_at: '2026-10-20', reviewed_by_role: GCC content owner}
  - projection_id: gcc-historical-funding-directions
    topic: Historical fund structure and directions
    language: zh-Hant
    scope: historical_only
    question_examples:
      - GCC 過往支持哪些公共物品方向？
      - 報告中的公共基金和專項基金是甚麼？
    answer_text: 在《2023–2025 公共物品之路》所描述的歷史架構中，公共基金方向包括反審查與加密隱私、全球公共人才網絡、自由開源軟件，以及治理研究與實驗；專項基金例子包括 Builder 機票、ETH City 與高校、GCC × 706 和 GCC × Mastodon。這是報告期內的歷史方向，現行資助政策應以 GCC 最新官方資料為準。
    source_references:
      - source_id: gcc-report-2023-2025-cn
        section_ids: [fund-structure]
    citation:
      label: GCC 2023–2025 公共物品之路
      url: https://drive.google.com/file/d/15HztLjCcUtatmknZuUZbjb1ifEojzKfR/view
    excluded_claims:
      - current application eligibility
      - current funding priorities
    review: {status: approved, reviewed_at: '2026-10-20', reviewed_by_role: GCC content owner}
  - projection_id: gcc-historical-project-catalogue
    topic: Historical project catalogue
    language: zh-Hant
    scope: historical_only
    question_examples:
      - GCC 報告列出過哪些項目？
      - 報告中的資助項目有哪些類別？
    answer_text: 報告按歷史類別列出多個項目：隱私與安全包括 Tornado Cash／WeWantJusticeDAO、DeFi Hacklabs、Web3 Privacy Now、ZKP2P、Community Privacy Residency、ZKPunk、Chain Mirror、Mastodon、OSKey、Primus、SnarkExpress 和 Vyper；開發者與黑客松包括 The Mu、登鏈社區、EPF 協議研究、AdventureX、Colony House、Remix 中文、Herstory 和 Invisible Garden Argentina；另有社會科學、去中心化治理，以及媒體與開放資訊類別。這份名單只反映報告期內的歷史收錄，不單獨證明個別付款、milestone 或現況。
