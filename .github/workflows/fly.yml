name: Fly Deploy
on:
  push:
    branches:
      - main  # 只有當你把程式推送到 main 分支時才啟動部署

permissions:
  contents: read

concurrency:
  group: fly-production
  cancel-in-progress: false

jobs:
  test:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q gcc_agent main.py
      - run: python tests/test_regression.py
      - run: python -m unittest tests.test_logging
      - run: python -m unittest tests.test_webhook_security
      - run: python -m unittest tests.telegram.test_group_mentions tests.persistence.test_session_scopes tests.persistence.test_migrations
      - run: python -m unittest tests.ops.test_sqlite_backup

  deploy:
    name: Deploy app
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
