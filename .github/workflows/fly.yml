name: Fly Deploy
on:
  push:
    branches:
      - main  # Production deploys only after a tested main push.
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: fly-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q gcc_agent main.py
      - run: python -m tests

  deploy:
    name: Deploy app
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  alert:
    name: Alert on production deploy failure
    needs: [test, deploy]
    if: ${{ always() && github.event_name == 'push' && (needs.test.result == 'failure' || needs.deploy.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open deploy incident
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          gh issue create --repo "$REPOSITORY" \
            --title "[OPS] Production deploy failed: run $RUN_ID" \
            --body "The main release for commit $SHA failed. Inspect https://github.com/$REPOSITORY/actions/runs/$RUN_ID and follow docs/operations-runbook.md. No user content is included."
