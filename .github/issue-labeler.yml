# github/issue-labeler uses JavaScript RegExp.
# Use /pattern/flags (not Python/PCRE (?i)). All regexes under a label must match (AND).

bug:
  - '/(\bbug\b|\bfix(es|ed|ing)?\b|\berror\b|\bcrash\b|\bfail(ed|ure)?\b|缺陷|报错|错误|崩溃|异常)/i'

enhancement:
  - '/(\benhancement\b|\bfeat(ure)?\b|\bimprove(ment)?\b|\benhance\b|新功能|改进|增强|优化)/i'

docs:
  - '/(\bdocs?\b|\breadme\b|\bdocumentation\b|文档)/i'

security:
  - '/(\bsecur(e|ity)\b|\bvuln(erabilit(y|ies))?\b|\bcve\b|\bsecret[s]?\b|\bssrf\b|\bidor\b|安全|漏洞|鉴权|敏感信息)/i'

access:
  - '/(\baccess\b|\bidentity\b|\bgcc[_-]?member\b|\b\/grant\b|\b\/email\b|\b\/verify\b|\botp\b|身份|邮箱验证)/i'

applications:
  - '/(\bapplication[s]?\b|\bscreen(ing)?\b|\bpre-?screen\b|申请|预筛)/i'

qa:
  - '/(\bqa\b|\bq&a\b|\blink-first\b|问答)/i'

knowledge:
  - '/(\bknowledge\b|\bvalues\.yaml\b|\bprojects\.yaml\b|\bcase[s]?\b|知识库|价值观|案例)/i'

ci:
  - '/(\bci\b|\bgithub actions?\b|\bworkflow[s]?\b|\blabeler\b|流水线|工作流)/i'

telegram:
  - '/(\btelegram\b|\bbot\b|\bwebhook\b|机器人)/i'

tests:
  - '/(\btests?\b|\bpytest\b|\bcoverage\b|测试|单测)/i'

deploy:
  - '/(\bfly\.io\b|\bflyctl\b|\bdocker\b|\bdeploy(ment)?\b|部署)/i'
