# fly.toml app configuration file generated for gcc-public-goods-bot on 2026-04-24T20:07:27+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'gcc-public-goods-bot'
primary_region = 'nrt'

[build]

[deploy]
  # SQLite is stored on one regional volume, so deploy the single Machine in place.
  strategy = 'rolling'
  max_unavailable = 1

[mounts]
  source = 'gcc_agent_data'
  destination = '/data'
  processes = ['app']

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Avoid Telegram webhook cold starts and keep only the primary Machine warm.
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
