# projects.yaml — GCC 已資助項目知識庫 v1.0
# 用途：Agent 預審時參考成功案例，判斷申請方向是否符合 GCC 資助方向
# 更新方式：直接編輯此檔，重啟 bot 或執行 /update_values 生效
#
# 欄位說明：
#   name        項目名稱
#   category    主要類別
#   fund_type   資助基金類型：public / special
#   amount      資助金額（USD）
#   keywords    核心關鍵詞（用於預審相似度匹配）
#   region      主要受益地區
#   summary     項目核心描述
#   why_funded  符合 GCC 資助方向的原因（預審判斷依據）
#
# 類別清單：
#   開源軟件    開放原始碼工具、語言、框架
#   加密隱私    隱私保護、抗審查、加密工具、ZK
#   治理研究    鏈上/鏈下治理、DAO、公民參與
#   公共人才    人才培育、社區建設、教育
#   基礎設施    協議、標準、底層技術
#   社會公益    社會議題、人文關懷、文化保存
#   活動資助    會議、工作坊、社區聚會
#   媒體內容    獨立媒體、開放內容、知識傳播

version: "1.0.0"

